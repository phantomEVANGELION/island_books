name: build-ios-unsigned

# 手动触发（可以在 iPhone 上打开 GitHub 点 Run workflow），
# 也可以 push 一个 v* 标签自动触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: 确认环境
        run: |
          flutter --version
          xcodebuild -version

      - name: 拉依赖
        run: flutter pub get

      - name: 编译（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包成 IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r -y island_books_unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: island_books-unsigned-ipa
          path: build/ios/iphoneos/island_books_unsigned.ipa
          retention-days: 7
