name: island_books
description: "岛上书店 —— 本地 EPUB / TXT 阅读器"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 解压 epub（本质是 zip）
  archive: ^4.0.2
  # 解析 OPF / NCX / XHTML
  xml: ^6.5.0
  collection: ^1.19.0
  # 还原 epub 里被「字体混淆」过的内嵌字体（IDPF / Adobe 的 XOR 算法要用 SHA1）
  crypto: ^3.0.6

  # 本地数据
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # 文件选择（走 SAF，不需要存储权限）
  # 8.x 的 compileSdk 是 34，会被 flutter_plugin_android_lifecycle 要求 36 而拒绝
  file_picker: ^13.3.0

  # 自定义封面：从相册选图
  image_picker: ^1.1.2

  # 阅读渲染：WebView + 注入 CSS/JS
  # 用官方的 webview_flutter（flutter_inappwebview 1.1.3 用了 AGP 9 已废弃的
  # getDefaultProguardFile('proguard-android.txt')，直接编译失败）
  webview_flutter: ^4.10.0
  # iOS 上需要 WebKitLoadFileParams 来指定本地文件的沙盒读权限范围
  # （默认只授权 index.html 所在目录，字体会读不到）。仅 darwin 平台生效。
  webview_flutter_wkwebview: ^3.27.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/reader/
    # 内置字体：思源宋体 + 霞鹜文楷，各约 24MB
    - assets/fonts/
